server:
  port: 8081

spring:
  application:
    name: api-gateway
  # Default profile targets Docker Compose (services resolve by name).
  # Run with SPRING_PROFILES_ACTIVE=local to hit services on localhost instead.
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      routes:
        - id: sms-service
          uri: ${SMS_SERVICE_URI:http://sms-service:8082}
          predicates:
            - Path=/api/v1/notifications/sms/**,/api/v1/notifications/sms
          filters:
            - name: RequestRateLimiter
              args:
                # Token-bucket ~= 10 requests / 3s system-wide (README commit 75fd8bd).
                redis-rate-limiter.replenishRate: 4
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@systemKeyResolver}"
        - id: email-service
          uri: ${EMAIL_SERVICE_URI:http://email-service:8083}
          predicates:
            - Path=/api/v1/notifications/email/**,/api/v1/notifications/email
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 4
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@systemKeyResolver}"

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: local
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      routes:
        - id: sms-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/notifications/sms/**,/api/v1/notifications/sms
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 4
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@systemKeyResolver}"
        - id: email-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/notifications/email/**,/api/v1/notifications/email
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 4
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@systemKeyResolver}"
