# Test config: in-memory H2 so context/integration tests need no Postgres.
# JavaMailSender is mocked in tests, so mail.* just needs to be present.
spring:
  datasource:
    url: jdbc:h2:mem:emailtestdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  mail:
    host: localhost
    port: 1025

# JavaMailSender is a Mockito mock in tests; skip the mail health probe over it.
management:
  health:
    mail:
      enabled: false
