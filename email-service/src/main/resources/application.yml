server:
  port: 8083

spring:
  application:
    name: email-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/notifications}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  mail:
    # Defaults target the Mailpit container; override to point at a real SMTP host.
    host: ${MAIL_HOST:mailpit}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

email:
  from: ${EMAIL_FROM:no-reply@rate-limiter.local}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
