server:
  port: 8082

spring:
  application:
    name: sms-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/notifications}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

# Which SMS provider to use: "mock" (default, logs only) or "twilio" (real).
sms:
  provider: ${SMS_PROVIDER:mock}

# Populated only when sms.provider=twilio.
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  from-number: ${TWILIO_FROM_NUMBER:}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
