# Test config: in-memory H2 so context/integration tests need no Postgres.
spring:
  datasource:
    url: jdbc:h2:mem:smstestdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

sms:
  provider: mock
